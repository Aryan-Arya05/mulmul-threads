<style>
:root{--bg:#f5f5f5;--panel:#ffffff;--field:#ffffff;--ink:#282828;--mut:#6b6b6b;--line:#dfdfdf;--acc:#282828;--acc2:#000000;--acc-ink:#ffffff;--soft:#f5f1ec;--soft2:#efefef;--hover:#f7f7f7;--hl-bg:#ffdcdc;--hl-ink:#282828;--ok:#2e9e7b;--ok-bg:#d5ece5;--warn:#a86a12;--warn-bg:#f8ecd4;--bad:#de2a2a;--bad-bg:#fdf0f0;--side:#282828;--side-ink:#ffffff;--side-mut:#c9c9c9;--side-hover:#3a3a3a;--side-on:#ffffff;--side-on-ink:#282828;--logo-filter:invert(1);--r:8px;color-scheme:light}
[data-theme=dark]{--bg:#121212;--panel:#1c1c1c;--field:#242424;--ink:#f2f2f2;--mut:#a3a3a3;--line:#333333;--acc:#f2f2f2;--acc2:#ffffff;--acc-ink:#161616;--soft:#2a2a2a;--soft2:#262626;--hover:#252525;--hl-bg:#4a2c2c;--hl-ink:#ffdcdc;--ok:#5cc9a4;--ok-bg:#16332a;--warn:#e0b060;--warn-bg:#3a2d14;--bad:#ff7a7a;--bad-bg:#3d1c1c;--side:#0b0b0b;--side-ink:#ffffff;--side-mut:#a3a3a3;--side-hover:#222222;--side-on:#f2f2f2;--side-on-ink:#161616;--logo-filter:none;color-scheme:dark}
[data-theme=eye]{--bg:#f1e7d3;--panel:#f8efdc;--field:#fbf4e4;--ink:#3b3024;--mut:#7a6a55;--line:#dccdb0;--acc:#4a3a28;--acc2:#2f2418;--acc-ink:#f8efdc;--soft:#e9dcc2;--soft2:#e6d9bf;--hover:#f0e5cf;--hl-bg:#efd2b8;--hl-ink:#3b3024;--ok:#4f7a4a;--ok-bg:#dde3c4;--warn:#96621a;--warn-bg:#efdcae;--bad:#a8432f;--bad-bg:#f0d3c2;--side:#3b3024;--side-ink:#f8efdc;--side-mut:#cdbfa5;--side-hover:#4d4031;--side-on:#f8efdc;--side-on-ink:#3b3024;--logo-filter:invert(1) sepia(1) brightness(.35);color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
h1,h2,h3{font-weight:600;margin:0;letter-spacing:-.01em}
h1{font-size:24px}h2{font-size:18px}h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--acc2)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.pri:hover{background:var(--acc2);border-color:var(--acc2)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
input,select,textarea{border:1px solid var(--line);background:var(--field);border-radius:6px;padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--soft);border-color:var(--acc2)}
input[type=checkbox]{width:auto}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:12px 0 4px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)}.sm{font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft);color:var(--ink)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.gray{background:var(--soft2);color:var(--mut)}
.badge{background:var(--acc);color:var(--acc-ink);border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px;min-width:18px;text-align:center}
.av{width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none}

/* auth */
.auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.auth .card{width:100%;max-width:400px;padding:28px}
.brand{font-size:20px;font-weight:600;color:var(--ink)}
.logo{display:block;height:54px;width:auto}
.auth .logo{filter:var(--logo-filter);margin-bottom:10px}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}

/* shell */
#app{height:100%}
.shell{display:grid;grid-template-columns:210px 1fr;height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:16px 10px;gap:2px;overflow:auto}
.side .brand{padding:6px 10px 16px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;color:var(--side-mut);border:0;background:none;text-align:left;width:100%}
.nav:hover{background:var(--side-hover);color:var(--side-ink)}.nav.on{background:var(--side-on);color:var(--side-on-ink);font-weight:600}
.nav .badge{margin-left:auto;background:#ffdcdc;color:#282828}
.side .me{margin-top:auto;padding:10px;border-top:1px solid var(--side-hover);font-size:13px}
.side .me a{color:var(--side-mut)}
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.view{flex:1;overflow:auto;padding:20px;min-height:0}
.view.flush{padding:0;overflow:hidden}
.bell{position:relative}
.bell .badge{position:absolute;top:-6px;right:-6px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat b{font-size:28px;font-weight:600;display:block}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tw{overflow-x:auto}
.item{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item:hover{background:var(--hover)}
.empty{color:var(--mut);padding:18px 4px;text-align:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:13px;font-weight:500}
.tab.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}

/* chat */
.chat{display:grid;grid-template-columns:260px 1fr;height:100%}
.clist{border-right:1px solid var(--line);overflow:auto;background:var(--panel);padding:10px}
.clist h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:14px 8px 4px;display:flex;justify-content:space-between;align-items:center}
.ch{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;cursor:pointer}
.ch:hover{background:var(--soft)}.ch.on{background:var(--soft);font-weight:600}
.ch .badge{margin-left:auto}
.ch.unread{font-weight:700}
.pane{display:flex;flex-direction:column;min-width:0;height:100%;min-height:0}
.phead{padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;gap:10px;align-items:center}
.msgs{flex:1;overflow:auto;padding:12px 16px;min-height:0}
.msg{display:flex;gap:10px;padding:6px 6px;border-radius:8px;position:relative}
.msg:hover{background:var(--hover)}
.msg .mb{white-space:pre-wrap;word-break:break-word}
.msg .ma{display:none;position:absolute;right:8px;top:-10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
.msg:hover .ma{display:flex}
.msg .del{color:var(--mut);font-style:italic}
.men{background:var(--hl-bg);color:var(--hl-ink);border-radius:4px;padding:0 3px;font-weight:600}
.daysep{text-align:center;font-size:12px;color:var(--mut);margin:12px 0 6px}
.comp{border-top:1px solid var(--line);padding:10px 14px;background:var(--panel);display:flex;gap:8px;align-items:flex-end;position:relative}
.comp textarea{resize:none;max-height:140px}
.mlist{position:absolute;bottom:100%;left:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px #0002;max-height:200px;overflow:auto;min-width:220px}
.mlist div{padding:7px 12px;cursor:pointer}.mlist div:hover{background:var(--soft)}
.back{display:none}

/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto}
.col{background:var(--soft2);border-radius:var(--r);padding:10px;min-height:120px}
.col h4{margin:2px 4px 10px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.tk{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer}
.tk:hover{border-color:var(--acc2)}

/* calendar */
.day{border-bottom:1px solid var(--line);padding:10px 0;display:grid;grid-template-columns:90px 1fr;gap:10px}
.day.today .dl{color:var(--acc);font-weight:700}
.ev{border-left:4px solid var(--acc);background:var(--panel);border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.ev.block{border-left-color:var(--mut);background:var(--soft2)}

/* notes */
.notes{display:grid;grid-template-columns:270px 1fr;height:100%}
.nlist{border-right:1px solid var(--line);overflow:auto;background:var(--panel);padding:10px}
.ned{padding:18px;overflow:auto;display:flex;flex-direction:column;gap:10px;min-width:0}
.ned textarea{flex:1;min-height:300px;resize:none;line-height:1.6}
.ned .ttl{font-weight:600;font-size:22px;border:0;background:transparent;padding:4px 0}

/* modal, panel, toast */
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
.modal{background:var(--panel);border-radius:12px;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:22px}
.modal.wide{max-width:680px}
.modal.xl{max-width:980px}
.pick{border:1px solid var(--line);border-radius:9px;max-height:170px;overflow:auto;padding:6px 10px;background:var(--field)}
.pick label{display:flex;gap:8px;align-items:center;margin:4px 0;font-weight:400;color:var(--ink);font-size:14px}
.npanel{position:fixed;top:56px;right:14px;width:360px;max-width:calc(100vw - 28px);max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 40px #0003;z-index:40;padding:8px}
.nt{padding:10px;border-radius:9px;cursor:pointer}.nt:hover{background:var(--soft)}.nt.un{background:var(--hl-bg);color:var(--hl-ink)}
#toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;box-shadow:0 4px 16px #0003}
.thread{border-top:1px solid var(--line);margin-top:16px;padding-top:10px}
.thread .u{padding:6px 0;font-size:14px}

@media (max-width:820px){
  .shell{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .side{position:fixed;top:0;bottom:0;left:0;width:272px;max-width:84vw;z-index:45;transform:translateX(-102%);transition:transform .2s ease;box-shadow:0 0 40px #0006}
  .shell.menu .side{transform:none}
  .shell.menu .scrim{display:block}
  .nav{padding:12px 14px;font-size:16px}
  .tabbar{display:flex}
  .main{grid-row:1}
  .view{padding:14px}
  .chat,.notes{grid-template-columns:1fr}
  .chat.open .clist,.notes.open .nlist{display:none}
  .chat:not(.open) .pane,.notes:not(.open) .ned{display:none}
  .back{display:inline-block}
  .board{grid-template-columns:repeat(4,240px)}
  .msg .ma{display:flex;position:static;border:0;background:none;margin-top:2px}
  .day{grid-template-columns:1fr}
  #tfil,.wk{flex-basis:100%}
  .top{padding:10px 12px;gap:6px}
  .top .btn{padding:6px 10px;font-size:13px}
}
.ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.scrim{display:none;position:fixed;inset:0;background:#0009;z-index:44}
.tabbar{display:none;background:var(--side);padding:6px 8px;justify-content:space-around;grid-row:2}
.tb{position:relative;border:0;background:none;color:var(--side-mut);padding:10px 18px;border-radius:12px;cursor:pointer;display:flex}
.tb .ico{width:26px;height:26px}
.tb.on{background:var(--side-on);color:var(--side-on-ink)}
.tb .badge{position:absolute;top:2px;right:6px;background:#ffdcdc;color:#282828}
.navsep{border-top:1px solid var(--side-hover);margin:8px 6px}
@media (max-width:820px){.tabbar{display:flex}}
#splash{position:fixed;inset:0;z-index:100;background:#000;color:#f5f0e6;display:flex;align-items:center;justify-content:center;font-family:"Times New Roman",Times,Georgia,serif;font-size:clamp(44px,9vw,84px);letter-spacing:.01em;transition:opacity .6s ease}
#splash span{opacity:0;animation:splashIn .7s ease .1s forwards}
#splash.hide{opacity:0;pointer-events:none}
@keyframes splashIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#splash,#splash span{transition:none;animation:none;opacity:1}}
.ev.google{border-left-color:#4285f4}
#dov{z-index:55}
.comp{flex-wrap:wrap}
.pend{flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap}
.pend:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:99px;padding:3px 6px 3px 12px;font-size:13px;max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.chip button{border:0;background:none;cursor:pointer;color:var(--mut);font-size:15px;padding:0 4px}
.att{display:block;max-width:min(280px,100%);max-height:240px;border-radius:8px;margin-top:6px;cursor:pointer;background:var(--soft2);min-height:60px;min-width:80px}
.attf{display:inline-flex;align-items:center;gap:8px;margin-top:6px;margin-right:6px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);text-decoration:none;max-width:100%}
.choice{display:flex;gap:12px;align-items:center;width:100%;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;text-align:left;margin-top:10px;color:var(--ink);font-weight:400}
.choice:hover{border-color:var(--acc)}
.aimsg{display:flex;gap:10px;padding:8px 6px}
.aimsg.me{justify-content:flex-end}
.aimsg .bub{max-width:min(640px,86%);padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-break:break-word;background:var(--panel);border:1px solid var(--line)}
.aimsg.me .bub{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.aimsg.err .bub{border-color:var(--bad);color:var(--bad)}
.sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.side .brand{cursor:pointer}
.logo-sm{display:none;width:40px;height:40px;border-radius:9px}
@media (min-width:821px){
  .shell{transition:grid-template-columns .18s ease}
  .shell.mini{grid-template-columns:68px 1fr}
  .shell.mini .side{padding:16px 8px;align-items:center}
  .shell.mini .nav{justify-content:center;padding:11px 0;position:relative}
  .shell.mini .nav > span:not(.badge){display:none}
  .shell.mini .nav .badge{position:absolute;top:2px;right:4px;margin:0}
  .shell.mini .side .brand{padding:2px 0 14px}
  .shell.mini .side .brand .logo{display:none}
  .shell.mini .logo-sm{display:block}
  .shell.mini .side .me{display:none}
  .shell.mini .navsep{width:70%}
}
@media (max-width:820px){.top [data-act=sideToggle]{display:none !important}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:100vw;background:var(--panel);border-left:1px solid var(--line);z-index:42;display:flex;flex-direction:column;box-shadow:-8px 0 30px #0003}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.drawer .db{flex:1;overflow:auto;padding:14px;min-height:0}
@media (min-width:821px){body.drawer-open .main{margin-right:380px}}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.mgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;cursor:pointer;background:var(--soft2);display:block}
.sres{padding:10px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.sres:hover{background:var(--hover)}
.sres mark{background:var(--hl-bg);color:var(--hl-ink);border-radius:3px;padding:0 2px}
.msg.flash{animation:flash 1.8s ease}
@keyframes flash{0%,60%{background:var(--hl-bg)}100%{background:transparent}}
.ptitle{cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pinb{display:none;border:0;background:none;color:var(--mut);padding:0 2px;cursor:pointer;flex:none}
.pinb .ico{width:16px;height:16px}
.pinb.on{display:flex;color:var(--ink)}
.pinb.on .ico{fill:currentColor}
@media (hover:hover){.ch:hover .pinb{display:flex}}
#pinbtn.on .ico{fill:currentColor}
#upd{position:fixed;top:0;left:0;right:0;z-index:70;background:var(--hl-bg);color:var(--hl-ink);padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:center;font-weight:500;box-shadow:0 2px 12px #0003}
#vtitle{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.acct{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 5px}
@media (max-width:480px){.acctn{display:none}.top [data-act=theme]{display:none}}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
.th{border:2px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;background:var(--panel);text-align:left;color:var(--ink)}
.th.on{border-color:var(--acc)}
.th .sw{height:46px;border-radius:6px;margin-bottom:8px;border:1px solid #0002;display:flex;overflow:hidden}
.th .sw i{flex:1}
</style>
