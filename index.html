<style>
:root{--bg:#f5f5f5;--panel:#ffffff;--field:#ffffff;--ink:#282828;--mut:#6b6b6b;--line:#dfdfdf;--acc:#282828;--acc2:#000000;--acc-ink:#ffffff;--soft:#f5f1ec;--soft2:#efefef;--hover:#f7f7f7;--hl-bg:#ffdcdc;--hl-ink:#282828;--ok:#2e9e7b;--ok-bg:#d5ece5;--warn:#a86a12;--warn-bg:#f8ecd4;--bad:#de2a2a;--bad-bg:#fdf0f0;--side:#282828;--side-ink:#ffffff;--side-mut:#c9c9c9;--side-hover:#3a3a3a;--side-on:#ffffff;--side-on-ink:#282828;--logo-filter:invert(1);--r:8px;color-scheme:light}
[data-theme=dark]{--bg:#121212;--panel:#1c1c1c;--field:#242424;--ink:#f2f2f2;--mut:#a3a3a3;--line:#333333;--acc:#f2f2f2;--acc2:#ffffff;--acc-ink:#161616;--soft:#2a2a2a;--soft2:#262626;--hover:#252525;--hl-bg:#4a2c2c;--hl-ink:#ffdcdc;--ok:#5cc9a4;--ok-bg:#16332a;--warn:#e0b060;--warn-bg:#3a2d14;--bad:#ff7a7a;--bad-bg:#3d1c1c;--side:#0b0b0b;--side-ink:#ffffff;--side-mut:#a3a3a3;--side-hover:#222222;--side-on:#f2f2f2;--side-on-ink:#161616;--logo-filter:none;color-scheme:dark}
[data-theme=eye]{--bg:#f1e7d3;--panel:#f8efdc;--field:#fbf4e4;--ink:#3b3024;--mut:#7a6a55;--line:#dccdb0;--acc:#4a3a28;--acc2:#2f2418;--acc-ink:#f8efdc;--soft:#e9dcc2;--soft2:#e6d9bf;--hover:#f0e5cf;--hl-bg:#efd2b8;--hl-ink:#3b3024;--ok:#4f7a4a;--ok-bg:#dde3c4;--warn:#96621a;--warn-bg:#efdcae;--bad:#a8432f;--bad-bg:#f0d3c2;--side:#3b3024;--side-ink:#f8efdc;--side-mut:#cdbfa5;--side-hover:#4d4031;--side-on:#f8efdc;--side-on-ink:#3b3024;--logo-filter:invert(1) sepia(1) brightness(.35);color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
h1,h2,h3{font-weight:600;margin:0;letter-spacing:-.01em}
h1{font-size:24px}h2{font-size:18px}h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--acc2)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.pri:hover{background:var(--acc2);border-color:var(--acc2)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
input,select,textarea{border:1px solid var(--line);background:var(--field);border-radius:6px;padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--soft);border-color:var(--acc2)}
input[type=checkbox]{width:auto}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:12px 0 4px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)}.sm{font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft);color:var(--ink)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.gray{background:var(--soft2);color:var(--mut)}
.badge{background:var(--acc);color:var(--acc-ink);border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px;min-width:18px;text-align:center}
.av{width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none}

/* auth */
.auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.auth .card{width:100%;max-width:400px;padding:28px}
.brand{font-size:20px;font-weight:600;color:var(--ink)}
.logo{display:block;height:54px;width:auto}
.auth .logo{filter:var(--logo-filter);margin-bottom:10px}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}

/* shell */
#app{height:100%}
.shell{display:grid;grid-template-columns:210px 1fr;height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:16px 10px;gap:2px;overflow:auto}
.side .brand{padding:6px 10px 16px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;color:var(--side-mut);border:0;background:none;text-align:left;width:100%}
.nav:hover{background:var(--side-hover);color:var(--side-ink)}.nav.on{background:var(--side-on);color:var(--side-on-ink);font-weight:600}
.nav .badge{margin-left:auto;background:#ffdcdc;color:#282828}
.side .me{margin-top:auto;padding:10px;border-top:1px solid var(--side-hover);font-size:13px}
.side .me a{color:var(--side-mut)}
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.view{flex:1;overflow:auto;padding:20px;min-height:0}
.view.flush{padding:0;overflow:hidden}
.bell{position:relative}
.bell .badge{position:absolute;top:-6px;right:-6px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat b{font-size:28px;font-weight:600;display:block}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tw{overflow-x:auto}
.item{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item:hover{background:var(--hover)}
.empty{color:var(--mut);padding:18px 4px;text-align:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:13px;font-weight:500}
.tab.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}

/* chat */
.chat{display:grid;grid-template-columns:260px 1fr;height:100%}
.clist{border-right:1px solid var(--line);overflow:auto;background:var(--panel);padding:10px}
.clist h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:14px 8px 4px;display:flex;justify-content:space-between;align-items:center}
.ch{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;cursor:pointer}
.ch:hover{background:var(--soft)}.ch.on{background:var(--soft);font-weight:600}
.ch .badge{margin-left:auto}
.ch.unread{font-weight:700}
.pane{display:flex;flex-direction:column;min-width:0;height:100%;min-height:0}
.phead{padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;gap:10px;align-items:center}
.msgs{flex:1;overflow:auto;padding:12px 16px;min-height:0}
.msg{display:flex;gap:10px;padding:6px 6px;border-radius:8px;position:relative}
.msg:hover{background:var(--hover)}
.msg .mb{white-space:pre-wrap;word-break:break-word}
.msg .ma{display:none;position:absolute;right:8px;top:-10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
.msg:hover .ma{display:flex}
.msg .del{color:var(--mut);font-style:italic}
.men{background:var(--hl-bg);color:var(--hl-ink);border-radius:4px;padding:0 3px;font-weight:600}
.daysep{text-align:center;font-size:12px;color:var(--mut);margin:12px 0 6px}
.comp{border-top:1px solid var(--line);padding:10px 14px;background:var(--panel);display:flex;gap:8px;align-items:flex-end;position:relative}
.comp textarea{resize:none;max-height:140px}
.mlist{position:absolute;bottom:100%;left:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px #0002;max-height:200px;overflow:auto;min-width:220px}
.mlist div{padding:7px 12px;cursor:pointer}.mlist div:hover{background:var(--soft)}
.back{display:none}

/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto}
.col{background:var(--soft2);border-radius:var(--r);padding:10px;min-height:120px}
.col h4{margin:2px 4px 10px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.tk{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer}
.tk:hover{border-color:var(--acc2)}

/* calendar */
.day{border-bottom:1px solid var(--line);padding:10px 0;display:grid;grid-template-columns:90px 1fr;gap:10px}
.day.today .dl{color:var(--acc);font-weight:700}
.ev{border-left:4px solid var(--acc);background:var(--panel);border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.ev.block{border-left-color:var(--mut);background:var(--soft2)}

/* notes */
.notes{display:grid;grid-template-columns:270px 1fr;height:100%}
.nlist{border-right:1px solid var(--line);overflow:auto;background:var(--panel);padding:10px}
.ned{padding:18px;overflow:auto;display:flex;flex-direction:column;gap:10px;min-width:0}
.ned textarea{flex:1;min-height:300px;resize:none;line-height:1.6}
.ned .ttl{font-weight:600;font-size:22px;border:0;background:transparent;padding:4px 0}

/* modal, panel, toast */
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
.modal{background:var(--panel);border-radius:12px;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:22px}
.modal.wide{max-width:680px}
.pick{border:1px solid var(--line);border-radius:9px;max-height:170px;overflow:auto;padding:6px 10px;background:var(--field)}
.pick label{display:flex;gap:8px;align-items:center;margin:4px 0;font-weight:400;color:var(--ink);font-size:14px}
.npanel{position:fixed;top:56px;right:14px;width:360px;max-width:calc(100vw - 28px);max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 40px #0003;z-index:40;padding:8px}
.nt{padding:10px;border-radius:9px;cursor:pointer}.nt:hover{background:var(--soft)}.nt.un{background:var(--hl-bg);color:var(--hl-ink)}
#toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;box-shadow:0 4px 16px #0003}
.thread{border-top:1px solid var(--line);margin-top:16px;padding-top:10px}
.thread .u{padding:6px 0;font-size:14px}

@media (max-width:820px){
  .shell{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .side{position:fixed;top:0;bottom:0;left:0;width:272px;max-width:84vw;z-index:45;transform:translateX(-102%);transition:transform .2s ease;box-shadow:0 0 40px #0006}
  .shell.menu .side{transform:none}
  .shell.menu .scrim{display:block}
  .nav{padding:12px 14px;font-size:16px}
  .tabbar{display:flex}
  .main{grid-row:1}
  .view{padding:14px}
  .chat,.notes{grid-template-columns:1fr}
  .chat.open .clist,.notes.open .nlist{display:none}
  .chat:not(.open) .pane,.notes:not(.open) .ned{display:none}
  .back{display:inline-block}
  .board{grid-template-columns:repeat(4,240px)}
  .msg .ma{display:flex;position:static;border:0;background:none;margin-top:2px}
  .day{grid-template-columns:1fr}
  #tfil,.wk{flex-basis:100%}
  .top{padding:10px 12px;gap:6px}
  .top .btn{padding:6px 10px;font-size:13px}
}
.ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.scrim{display:none;position:fixed;inset:0;background:#0009;z-index:44}
.tabbar{display:none;background:var(--side);padding:6px 8px;justify-content:space-around;grid-row:2}
.tb{position:relative;border:0;background:none;color:var(--side-mut);padding:10px 18px;border-radius:12px;cursor:pointer;display:flex}
.tb .ico{width:26px;height:26px}
.tb.on{background:var(--side-on);color:var(--side-on-ink)}
.tb .badge{position:absolute;top:2px;right:6px;background:#ffdcdc;color:#282828}
.navsep{border-top:1px solid var(--side-hover);margin:8px 6px}
@media (max-width:820px){.tabbar{display:flex}}
#splash{position:fixed;inset:0;z-index:100;background:#000;color:#f5f0e6;display:flex;align-items:center;justify-content:center;font-family:"Times New Roman",Times,Georgia,serif;font-size:clamp(44px,9vw,84px);letter-spacing:.01em;transition:opacity .6s ease}
#splash span{opacity:0;animation:splashIn .7s ease .1s forwards}
#splash.hide{opacity:0;pointer-events:none}
@keyframes splashIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#splash,#splash span{transition:none;animation:none;opacity:1}}
#upd{position:fixed;top:0;left:0;right:0;z-index:70;background:var(--hl-bg);color:var(--hl-ink);padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:center;font-weight:500;box-shadow:0 2px 12px #0003}
#vtitle{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.acct{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 5px}
@media (max-width:480px){.acctn{display:none}}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
.th{border:2px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;background:var(--panel);text-align:left;color:var(--ink)}
.th.on{border-color:var(--acc)}
.th .sw{height:46px;border-radius:6px;margin-bottom:8px;border:1px solid #0002;display:flex;overflow:hidden}
.th .sw i{flex:1}
</style>
</head>

<script>
// ---------- config ----------
const SB_URL = 'https://zcnthnhdwdtxalijrcik.supabase.co';
const SB_KEY = 'sb_publishable_FWivcWTl1QYFEXl5A6akMA_V2hbQcSD';
const GOOGLE_SIGNIN = true;
const VAPID_PUBLIC = 'BB6wM1DzOpN2ZUcNcVMCk7nwYKvu9D1Caz0_rYoF-rsPKfhWFQwvSMgC1e9GUD0xZiziRyAd7eyDrVlAQIcsDlk';
const sb = supabase.createClient(SB_URL, SB_KEY);

// ---------- state + helpers ----------
const S = { uid:null, me:null, org:{}, profiles:{}, teams:[], tm:[], channels:[], view:'home', chan:null, msgs:[], notifs:[],
  tasks:[], taskFilter:'mine', taskMode:'list', taskTeam:'', weekStart:null, calWho:'', events:[], notes:[], note:null,
  files:[], fileTeam:'', adminTab:'users', panel:false };
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P = id => S.profiles[id] || { full_name:'Unknown', email:'' };
const nm = id => P(id).full_name || P(id).email;
const ini = id => (nm(id).split(/\s+/).map(w => w[0]).join('').slice(0,2) || '?').toUpperCase();
const isAdmin = () => S.me && ['founder','admin'].includes(S.me.role);
const team = id => S.teams.find(t => t.id === id);
const myTeams = () => S.teams.filter(t => t.head_id === S.uid || S.tm.some(m => m.team_id === t.id && m.user_id === S.uid));
const people = () => Object.values(S.profiles).filter(p => p.active).sort((a,b) => a.full_name.localeCompare(b.full_name));
const d = ts => new Date(ts);
const fmtTime = ts => d(ts).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
const fmtDay = ts => d(ts).toLocaleDateString([], {weekday:'short', day:'numeric', month:'short'});
const fmtDT = ts => fmtDay(ts) + ', ' + fmtTime(ts);
const sameDay = (a,b) => d(a).toDateString() === d(b).toDateString();
const toInput = ts => { if(!ts) return ''; const x = d(ts); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0,16); };
const fromInput = v => v ? new Date(v).toISOString() : null;
const avatar = id => `<div class="av">${esc(ini(id))}</div>`;
function toast(m){ const t = document.createElement('div'); t.textContent = m; $('#toast').append(t); setTimeout(() => t.remove(), 3500); }
function fail(error){ if(error){ console.error(error); toast(error.message || 'Something went wrong'); return true; } return false; }
const opts = (list, sel, blank) => (blank != null ? `<option value="">${esc(blank)}</option>` : '') +
  list.map(o => `<option value="${esc(o.id)}" ${o.id === sel ? 'selected' : ''}>${esc(o.name)}</option>`).join('');
const teamOpts = (sel, blank, list) => opts((list || S.teams).map(t => ({id:t.id, name:t.name})), sel, blank);
const peopleOpts = (sel, blank) => opts(people().map(p => ({id:p.id, name:p.full_name})), sel, blank);
const pickList = (name, sel=[]) => `<div class="pick">${people().filter(p => p.id !== S.uid).map(p =>
  `<label><input type="checkbox" name="${name}" value="${p.id}" ${sel.includes(p.id) ? 'checked' : ''}> ${esc(p.full_name)} <span class="mut sm">${esc(p.title || '')}</span></label>`).join('') || '<div class="mut sm">No other people yet</div>'}</div>`;
const prioPill = p => `<span class="pill ${p==='urgent'?'bad':p==='high'?'warn':'gray'}">${esc(p)}</span>`;
const statusLabel = {todo:'To do', in_progress:'In progress', blocked:'Blocked', done:'Done'};
const statPill = s => `<span class="pill ${s==='done'?'ok':s==='blocked'?'bad':s==='in_progress'?'warn':'gray'}">${statusLabel[s]}</span>`;
function dueTxt(t){ if(!t.due_at) return ''; const over = t.status !== 'done' && d(t.due_at) < new Date();
  return `<span class="sm ${over ? '' : 'mut'}" style="${over ? 'color:var(--bad);font-weight:600' : ''}">${over ? 'Overdue · ' : 'Due '}${fmtDT(t.due_at)}</span>`; }
function rich(body){
  let h = esc(body).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  people().forEach(p => { if(p.full_name) h = h.split('@' + esc(p.full_name)).join(`<span class="men">@${esc(p.full_name)}</span>`); });
  return h;
}

// ---------- appearance ----------
const THEMES = [['light','Light',['#ffffff','#f5f5f5','#282828']],['dark','Dark',['#1c1c1c','#121212','#f2f2f2']],['eye','Eye care',['#f8efdc','#f1e7d3','#4a3a28']],['auto','Match device',['#ffffff','#282828','#1c1c1c']]];
function getTheme(){ try { return localStorage.getItem('mt-theme') || 'auto'; } catch(e){ return 'auto'; } }
function applyTheme(t){
  const eff = t === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
  document.documentElement.dataset.theme = eff;
  const m = document.getElementById('themeColor'); if(m) m.content = eff === 'dark' ? '#0b0b0b' : eff === 'eye' ? '#3b3024' : '#282828';
}
function setTheme(t){ try { localStorage.setItem('mt-theme', t); } catch(e){} applyTheme(t); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if(getTheme() === 'auto') applyTheme('auto'); });
applyTheme(getTheme());
function themeModal(){

  document.body.append(ov); modalSubmit = onSubmit;
  ov.addEventListener('mousedown', e => { if(e.target === ov) closeModal(); });
  $('form', ov).addEventListener('submit', async e => {

// ---------- phone / desktop alerts ----------
const canSW = 'serviceWorker' in navigator && location.protocol === 'https:';
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const pushSupported = () => canSW && 'PushManager' in window && 'Notification' in window;
function pushState(){ // on | off | blocked | ios-install | unsupported
  if(!pushSupported()) return isIOS && !isStandalone() ? 'ios-install' : 'unsupported';
  if(Notification.permission === 'denied') return 'blocked';
  return Notification.permission === 'granted' && S.pushOn ? 'on' : 'off';
}
const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
function vapidKey(){ const p = VAPID_PUBLIC.replace(/-/g, '+').replace(/_/g, '/'); const raw = atob(p + '='.repeat((4 - p.length % 4) % 4)); return Uint8Array.from(raw, c => c.charCodeAt(0)); }
async function syncPush(ask){
  if(!pushSupported()) return false;
  try {
    const reg = await navigator.serviceWorker.register('sw.js'); await navigator.serviceWorker.ready;
    if(ask && Notification.permission === 'default') await Notification.requestPermission();
    if(Notification.permission !== 'granted') return false;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){ if(!ask) return false; sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: vapidKey() }); }
    const { error } = await sb.rpc('save_push_subscription', { p_endpoint: sub.endpoint, p_p256dh: b64u(sub.getKey('p256dh')), p_auth: b64u(sub.getKey('auth')) });
    if(error) throw error; S.pushOn = true; return true;
  } catch(x){ console.error(x); if(ask) toast('Could not turn on alerts: ' + (x.message || x)); return false; }
}
async function dropPush(){
  try { if(!canSW) return; const reg = await navigator.serviceWorker.getRegistration(); const sub = reg && await reg.pushManager.getSubscription();
    if(sub){ await sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); } } catch(x){ console.error(x); }
  S.pushOn = false;
}
function alertsCard(){
  const st = pushState();
  if(st === 'on' || st === 'unsupported') return '';
  const msg = st === 'ios-install' ? 'To get alerts on iPhone: tap the Share button in Safari, choose <b>Add to Home Screen</b>, then open Threads from your home screen and turn alerts on.'
    : st === 'blocked' ? 'Alerts are blocked for this site. Allow notifications in your browser or phone settings, then reload.'
    : 'Get an alert on this device for new messages, task reminders and meeting invites, even when Threads is closed.';
  return `<div class="card" style="margin-bottom:14px;background:var(--hl-bg);color:var(--hl-ink)"><div class="row wrap"><div class="grow" style="min-width:200px"><b>Turn on alerts</b><div class="sm">${msg}</div></div>
    ${st === 'off' ? '<button class="btn pri" data-act="enablePush">Turn on alerts</button>' : ''}</div></div>`;
}

async function openChan(id){

function mentionMenu(box){

function paintMsgs(scroll){

async function searchMsgs(q){

// ---------- calendar ----------
function monday(x){ const m = new Date(x); m.setHours(0,0,0,0); m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); return m; }
VIEWS.calendar = async el => {
  if(!S.weekStart) S.weekStart = monday(new Date());
  head('Calendar', '<button class="btn" data-act="newBlock">Block time</button><button class="btn pri" data-act="newEvent">+ Meeting</button>');
  const ws = S.weekStart, we = new Date(ws); we.setDate(we.getDate() + 7);
  const { data, error } = await sb.from('events').select('*, event_attendees(user_id,response)').lt('starts_at', we.toISOString()).gt('ends_at', ws.toISOString()).order('starts_at');
  if(fail(error)) return; S.events = data || [];
  const who = S.calWho; const list = S.events.filter(e => !who || e.created_by === who || e.event_attendees.some(a => a.user_id === who));
  const last = new Date(we); last.setDate(last.getDate() - 1);
  let days = '';
  for(let i = 0; i < 7; i++){
    const day = new Date(ws); day.setDate(day.getDate() + i); const nx = new Date(day); nx.setDate(nx.getDate() + 1);
    const evs = list.filter(e => d(e.starts_at) < nx && d(e.ends_at) > day);
    days += `<div class="day ${sameDay(day, new Date()) ? 'today' : ''}"><div class="dl">${fmtDay(day)}</div><div>${evs.map(e => {
      const mine = e.event_attendees.find(a => a.user_id === S.uid);
      return `<div class="ev ${e.kind}" data-act="openEvent" data-id="${e.id}"><div class="row"><b class="grow">${esc(e.title)}</b>${e.is_private ? '<span class="pill gray">Private</span>' : ''}${mine ? `<span class="pill ${mine.response === 'yes' ? 'ok' : mine.response === 'no' ? 'bad' : 'warn'}">${mine.response === 'pending' ? 'Reply needed' : mine.response}</span>` : ''}</div>
        <div class="sm mut">${fmtTime(e.starts_at)} – ${fmtTime(e.ends_at)} · ${esc(nm(e.created_by))}${e.kind === 'meeting' ? ' · ' + (e.event_attendees.length + 1) + ' people' : ' · blocked'}</div></div>`; }).join('') || '<span class="mut sm">—</span>'}</div></div>`;
  }
  el.innerHTML = `<div class="row wrap" style="margin-bottom:10px"><button class="btn sm" data-act="week" data-d="-1">←</button><button class="btn sm" data-act="week" data-d="0">This week</button><button class="btn sm" data-act="week" data-d="1">→</button>
    <b class="grow wk">${fmtDay(ws)} – ${fmtDay(last)}</b>
    <select style="width:auto" data-chg="calWho">${opts([{id:S.uid, name:'My calendar'}].concat(people().filter(p => p.id !== S.uid).map(p => ({id:p.id, name:p.full_name}))), who, 'Everyone')}</select></div>
    <div class="card">${days}</div>`;
};
function eventModal(kind){
  const st = new Date(); st.setMinutes(0,0,0); st.setHours(st.getHours() + 1); const en = new Date(st); en.setHours(en.getHours() + (kind === 'block' ? 2 : 1));
  let warned = false;
  modal(kind === 'block' ? 'Block time' : 'New meeting', `
    <label>Title</label><input name="title" required maxlength="300" placeholder="${kind === 'block' ? 'e.g. Focus time, Store visit' : 'e.g. Weekly launch review'}">
    <div class="row wrap"><div class="grow"><label>Starts</label><input type="datetime-local" name="starts_at" required value="${toInput(st)}"></div>
      <div class="grow"><label>Ends</label><input type="datetime-local" name="ends_at" required value="${toInput(en)}"></div></div>
    ${kind === 'meeting' ? `<label>Location or meeting link</label><input name="location" placeholder="Conference room / Google Meet link">
      <label>Agenda</label><textarea name="description" rows="2"></textarea>
      <label>Invite people</label>${pickList('att')}
      <label>Or invite a whole team</label><select name="team_id">${teamOpts('', 'No team')}</select>` : ''}
    <label style="display:flex;gap:8px;align-items:center;font-weight:400;color:var(--ink)"><input type="checkbox" name="is_private"> Private (only invitees and founders can see it)</label>`,
    async f => {
      const s = fromInput(f.get('starts_at')), e = fromInput(f.get('ends_at'));
      if(d(e) <= d(s)) throw new Error('End time must be after the start time');
      const tid = f.get('team_id') || null;
      let att = new Set(f.getAll('att'));
      if(tid){ S.tm.filter(m => m.team_id === tid).forEach(m => att.add(m.user_id)); const h = team(tid)?.head_id; if(h) att.add(h); }
      att.delete(S.uid); att = [...att];
      if(!warned){
        const { data: ov } = await sb.from('events').select('title, created_by, starts_at, ends_at, event_attendees(user_id,response)').lt('starts_at', e).gt('ends_at', s);
        const busy = new Set(); const all = [S.uid, ...att];
        (ov || []).forEach(x => all.forEach(u => { if(x.created_by === u || x.event_attendees.some(a => a.user_id === u && a.response !== 'no')) busy.add(u); }));
        if(busy.size){ warned = true; $('#mok').textContent = 'Schedule anyway';
          throw new Error('Clash: ' + [...busy].map(u => u === S.uid ? 'You' : nm(u)).join(', ') + ' already ' + (busy.size > 1 ? 'have' : (busy.has(S.uid) ? 'have' : 'has')) + ' something at this time. Change the time, or press “Schedule anyway”.'); }
      }
      const { data: ev, error } = await sb.from('events').insert({ title: f.get('title').trim(), kind, starts_at: s, ends_at: e, location: (f.get('location') || '').trim() || null,
        description: (f.get('description') || '').trim() || null, team_id: tid, is_private: !!f.get('is_private'), created_by: S.uid }).select().single();
      if(error) throw error;
      if(att.length){ const r = await sb.from('event_attendees').insert(att.map(u => ({ event_id: ev.id, user_id: u }))); if(r.error) throw r.error; }
      toast(kind === 'block' ? 'Time blocked' : 'Meeting scheduled'); S.weekStart = monday(s); if(S.view === 'calendar' || S.view === 'home') render();
    }, { ok: kind === 'block' ? 'Block' : 'Schedule', wide:true });
}
function openEvent(id){

    <textarea id="nbody" placeholder="Write here…" ${can ? '' : 'readonly'}>${esc(n.body)}</textarea>`;
  if(!can) return;
  const save = async patch => { $('#nsaved').textContent = 'Saving…'; const { error } = await sb.from('notes').update(patch).eq('id', id);
    if(fail(error)){ $('#nsaved').textContent = 'Not saved'; return; } Object.assign(n, patch, { updated_at: new Date().toISOString() }); if($('#nsaved')) $('#nsaved').textContent = 'Saved'; paintNoteList(); };
  const later = () => { clearTimeout(noteTimer); const t = $('#nttl').value, b = $('#nbody').value; noteTimer = setTimeout(() => save({ title: t || 'Untitled', body: b }), 700); };
  $('#nttl').addEventListener('input', later); $('#nbody').addEventListener('input', later);
  if(own){
    const vis = $('#nvis'), tm = $('#nteam');
    const upd = () => { tm.hidden = vis.value !== 'team'; if(vis.value === 'team' && !tm.value) return; save({ visibility: vis.value, team_id: vis.value === 'team' ? tm.value : null }); };
    vis.addEventListener('change', upd); tm.addEventListener('change', upd);
  }
}

function teamMembersModal(id){

  eventNotes: async el => { const e = S.events.find(x => x.id === el.dataset.id); const { data } = await sb.from('notes').select('id').eq('event_id', e.id).limit(1);
    if(data && data[0]){ S.note = data[0].id; closeModal(); go('notes'); return; }
    newNote({ event_id: e.id, title: 'Notes: ' + e.title, body: `Meeting: ${e.title}\nWhen: ${fmtDT(e.starts_at)}\nAttendees: ${[e.created_by, ...e.event_attendees.map(a => a.user_id)].map(nm).join(', ')}\n\nDiscussion\n- \n\nDecisions\n- \n\nAction items\n- `,
      ...(e.team_id && (isAdmin() || myTeams().some(t => t.id === e.team_id)) ? { visibility:'team', team_id: e.team_id } : {}) }); },
  // notes
  newNote: () => newNote(), openNote: el => openNote(el.dataset.id), noteBack: () => { S.note = null; $('#notes').classList.remove('open'); paintNoteList(); },
  delNote: el => modal('Delete this note?', '<p class="mut">This cannot be undone.</p>', async () => { const { error } = await sb.from('notes').delete().eq('id', el.dataset.id); if(error) throw error; S.note = null; render(); }, { ok:'Delete' }),
  // files
  upload: () => { const tl = isAdmin() ? S.teams : myTeams();
    modal('Upload a file', `<label>File (up to 50 MB)</label><input type="file" name="file" required><label>Who can see it</label><select name="team">${teamOpts('', 'Everyone in the company', tl)}</select>`, async f => {
      const file = f.get('file'); if(!file || !file.size) throw new Error('Choose a file'); if(file.size > 52428800) throw new Error('File is larger than 50 MB');
      const tid = f.get('team') || null; const path = `${tid || 'org'}/${crypto.randomUUID()}-${file.name.replace(/[^\w.\-]+/g, '_')}`;
      const up = await sb.storage.from('files').upload(path, file); if(up.error) throw up.error;
      const { error } = await sb.from('files').insert({ name: file.name, path, size: file.size, mime: file.type || null, team_id: tid, uploaded_by: S.uid });
      if(error){ await sb.storage.from('files').remove([path]); throw error; } toast('Uploaded'); render(); }, { ok:'Upload' }); },
  download: async (el, e) => { e.preventDefault(); const f = S.files.find(x => x.id === el.dataset.id); const { data, error } = await sb.storage.from('files').createSignedUrl(f.path, 120, { download: f.name });
    if(fail(error)) return; const a = document.createElement('a'); a.href = data.signedUrl; a.target = '_blank'; a.rel = 'noopener'; document.body.append(a); a.click(); a.remove(); },
  delFile: el => { const f = S.files.find(x => x.id === el.dataset.id);
    modal('Delete ' + f.name + '?', '<p class="mut">This cannot be undone.</p>', async () => { await sb.storage.from('files').remove([f.path]); const { error } = await sb.from('files').delete().eq('id', f.id); if(error) throw error; render(); }, { ok:'Delete' }); },
  // people + admin
  editMe: () => modal('My profile', `<label>Full name</label><input name="full_name" required value="${esc(S.me.full_name)}"><label>Job title</label><input name="title" value="${esc(S.me.title || '')}">`, async f => {
    const { error } = await sb.from('profiles').update({ full_name: f.get('full_name').trim(), title: f.get('title').trim() || null }).eq('id', S.uid); if(error) throw error; await loadBase(); renderShell(); paintBell(); loadChannels(); go('people'); }),
  adminTab: el => { S.adminTab = el.dataset.t; render(); },
  setActive: async el => { const { error } = await sb.from('profiles').update({ active: el.dataset.v === '1' }).eq('id', el.dataset.id); if(!fail(error)){ toast(el.dataset.v === '1' ? 'Approved' : 'Access removed'); render(); } },
  teamEdit: el => { const t = el.dataset.id ? team(el.dataset.id) : null;
    modal(t ? 'Edit team' : 'New team', `<label>Name</label><input name="name" required value="${esc(t?.name || '')}" placeholder="e.g. Marketing, Store – Khan Market">
      <label>Type</label><select name="kind">${opts(['department','store','project'].map(x => ({id:x,name:x})), t?.kind || 'department')}</select>
      <label>Head POC</label><select name="head_id">${peopleOpts(t?.head_id, 'Not set')}</select>`, async f => {
      const row = { name: f.get('name').trim(), kind: f.get('kind'), head_id: f.get('head_id') || null };
      const { error } = t ? await sb.from('teams').update(row).eq('id', t.id) : await sb.from('teams').insert(row); if(error) throw error; toast('Team saved'); render(); },
      { extra: t ? `<button type="button" class="btn danger" data-act="teamDel" data-id="${t.id}">Delete team</button>` : '' }); },
  teamDel: async el => { const { error } = await sb.from('teams').delete().eq('id', el.dataset.id); if(fail(error)) return; closeModal(); toast('Team deleted'); render(); },
  teamMembers: el => teamMembersModal(el.dataset.id),
};
const C = {
  taskTeam: el => { S.taskTeam = el.value; paintTasks(); },
  calWho: el => { S.calWho = el.value; render(); },
  fileTeam: el => { S.fileTeam = el.value; render(); },
  setRole: async el => { const { error } = await sb.from('profiles').update({ role: el.value }).eq('id', el.dataset.id); if(!fail(error)) toast('Role updated'); render(); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(S.panel && !e.target.closest('#npanel') && !(el && el.dataset.act === 'togglePanel')){ S.panel = false; paintPanel(); }
  if(!el) return; const f = A[el.dataset.act]; if(f) f(el, e);
});
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if(el && C[el.dataset.chg]) C[el.dataset.chg](el); });
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if(S.me && S.me.active && VIEWS[v] && v !== S.view) go(v); });
document.addEventListener('visibilitychange', () => { if(!document.hidden && S.me && S.me.active){ loadChannels(); loadNotifs(); checkUpdate(); } });
sb.auth.onAuthStateChange((ev, session) => { setTimeout(() => boot(session), 0); });
</script>
</body>
</html>
